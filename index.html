<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <title>Wall Street.exe</title>
  <style>
    :root{--bg:#070b12;--panel:#0d1420;--panel2:#111b29;--line:#26354a;--text:#e8edf5;--muted:#8998ad;--gold:#e7b94e;--green:#23d18b;--red:#ff5562;--blue:#69a9ff}
    *{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}button,input{font:inherit}
    button{color:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px;background:linear-gradient(#09101a,#070b12)}
    .top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1.35fr .9fr .75fr;gap:6px;padding:8px;background:#070b12e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .chip{border:1px solid var(--line);background:var(--panel);padding:8px 9px;border-radius:8px;min-width:0}.chip b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip small{color:var(--muted);font-size:9px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}
    .scene{position:relative;min-height:610px;overflow:hidden;background:radial-gradient(circle at 50% 12%,#253150 0,#141928 28%,#0b0f17 64%);border-bottom:1px solid var(--line)}
    .sky{height:150px;background:linear-gradient(#251c42,#7c3b48 62%,#d07b49);position:relative;overflow:hidden}.sky:after{content:"";position:absolute;inset:50px 0 0;background:repeating-linear-gradient(90deg,#0a0d14 0 32px,transparent 32px 42px);opacity:.85}.window{position:absolute;left:6%;right:6%;top:24px;height:170px;border:8px solid #171b24;box-shadow:inset 0 0 0 2px #384150}
    .office-floor{position:absolute;inset:175px 0 0;background:linear-gradient(135deg,#1b1a1a,#121419 50%,#1b1715);background-size:24px 24px}.desk{position:absolute;background:#33251d;border:2px solid #594232;border-radius:5px;box-shadow:0 8px 0 #151313}.monitor{background:#061019;border:3px solid #343c48;border-radius:4px;box-shadow:0 0 18px #22d18a22 inset}.monitor:after{content:"⌁⌁╱╲⌁╱╲";color:var(--green);font-size:15px;letter-spacing:-2px;position:absolute;inset:18px 5px auto;text-align:center}.desk.main{left:17%;right:17%;top:210px;height:120px}.desk.side{left:4%;width:30%;top:365px;height:90px}.desk.finance{right:4%;width:30%;top:365px;height:90px}.monitor.m1{position:absolute;width:30%;height:75px;left:20%;top:182px}.monitor.m2{position:absolute;width:30%;height:75px;right:20%;top:182px}
    .person{position:absolute;width:34px;height:54px;background:#d8d0c4;border-radius:10px 10px 5px 5px;border:2px solid #171717}.person:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#c98e69;left:4px;top:-17px;border:2px solid #171717}.p1{left:46%;top:276px}.p2{left:17%;top:393px}.p3{right:17%;top:393px}
    .hotspot{position:absolute;border:1px solid #8e7944;background:#0b111be8;border-radius:6px;padding:7px 9px;box-shadow:0 0 0 1px #0008;color:#f3f0e6;text-align:left;font-size:10px}.hotspot b{display:block;color:#f4ce72;font-size:11px}.hotspot:hover,.hotspot:focus{outline:2px solid var(--gold)}.h-market{left:31%;top:145px}.h-analyst{left:4%;top:332px}.h-finance{right:4%;top:332px}.h-news{left:5%;top:60px}.h-city{left:38%;bottom:24px}.h-staff{right:8%;bottom:118px}
    .rug{position:absolute;left:26%;right:26%;bottom:72px;height:78px;border:1px solid #443f46;background:#191824;display:grid;place-items:center;color:#5d5a69;font-size:11px;transform:skewY(-2deg)}
    .page{padding:14px}.page h1{font-size:22px;margin:4px 0 14px;color:#f4ce72}.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:12px;margin-bottom:10px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.big{font-size:24px}.muted{color:var(--muted);font-size:11px}.btn{border:1px solid var(--line);background:#152238;border-radius:7px;padding:12px 14px;min-height:46px}.btn.primary{background:#123c31;border-color:#1aa873;color:#64f3b9}.btn.danger{background:#431a20;border-color:#bd3945;color:#ff8a93}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tx{display:grid;grid-template-columns:1fr auto;gap:5px;padding:10px 0;border-bottom:1px solid #1e2a3a}.tx:last-child{border:0}
    .market-head{display:grid;grid-template-columns:1fr auto;gap:8px}.timer{font-size:22px;color:var(--green)}canvas{display:block;width:100%;height:310px;background:#071019;border:1px solid var(--line);border-radius:8px}.tradebox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.size{width:100%;padding:12px;background:#09111d;border:1px solid var(--line);border-radius:7px;color:var(--text);margin:8px 0}.chat{height:150px;overflow:auto;font-size:11px}.chat p{margin:7px 0}.chatbar{display:flex;gap:6px}.chatbar input{min-width:0;flex:1;padding:10px;background:#080e17;color:white;border:1px solid var(--line);border-radius:6px}
    .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#080e17f2;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#8190a8;font-size:9px;padding:7px 2px}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--gold)}
    .city{min-height:650px;background:linear-gradient(#18162c,#713747 45%,#11151d 46%);position:relative;overflow:hidden}.building{position:absolute;bottom:0;background:#111722;border:2px solid #2c3542}.b1{left:5%;width:27%;height:310px}.b2{left:36%;width:28%;height:430px}.b3{right:4%;width:27%;height:350px}.building:after{content:"";position:absolute;inset:20px;background:repeating-linear-gradient(#e3ad4a 0 7px,transparent 7px 22px);opacity:.65}.citylabel{position:absolute;z-index:2;bottom:24px;left:15%;right:15%;text-align:center;background:#080d15dd;border:1px solid var(--gold);padding:10px;color:var(--gold)}
    @media(max-width:380px){.scene{min-height:560px}.hotspot{font-size:9px;padding:6px}.top{grid-template-columns:1.25fr .9fr .7fr}.chip{padding:7px 6px}}
  </style>
</head>
<body><div id="root"></div><script src="./app.js"></script></body>
</html>
